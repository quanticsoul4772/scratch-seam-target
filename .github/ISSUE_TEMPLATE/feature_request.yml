name: Feature request
description: Suggest an idea or improvement for this project
title: "[Feature]: "
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Thanks for taking the time to suggest a feature! Please fill in the sections below so we can understand and evaluate your idea.

              Before submitting, please read [CONTRIBUTING.md](../blob/HEAD/CONTRIBUTING.md).
    - type: textarea
      id: problem-motivation
      attributes:
          label: Problem / motivation
          description: What problem are you trying to solve, or what motivates this request?
          placeholder: I'm always frustrated when...
      validations:
          required: true
    - type: textarea
      id: proposed-solution
      attributes:
          label: Proposed solution
          description: Describe the solution or behavior you would like to see.
          placeholder: I would like it if...
      validations:
          required: true
    - type: textarea
      id: alternatives-considered
      attributes:
          label: Alternatives considered
          description: Describe any alternative solutions or workarounds you have considered.
      validations:
          required: false
    - type: textarea
      id: additional-context
      attributes:
          label: Additional context
          description: Add any other context, mockups, or screenshots about the feature request here.
      validations:
          required: false
    - type: checkboxes
      id: acknowledgements
      attributes:
          label: Acknowledgements
          description: Please confirm the following before submitting.
          options:
              - label: I have searched existing issues and read CONTRIBUTING.md and CODE_OF_CONDUCT.md.
                required: true
